name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
      - run: pip install pandas==3.0.5 openpyxl==3.1.5 pytest
      - run: python -m pytest -q
      - run: python scripts/build_workbook.py stage1.xlsx
